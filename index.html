<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digicloak - Real Work. Real Pay. Real Fast.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        
        /* New Color & Animation Styles */
        .gradient-text {
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-bg {
            background-color: #111827;
            background-image: 
                radial-gradient(circle at top right, rgba(129, 140, 248, 0.15), transparent 50%),
                radial-gradient(circle at bottom left, rgba(192, 132, 252, 0.15), transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239CA3AF' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .btn-primary {
             background: linear-gradient(90deg, #818cf8, #a855f7);
        }
        .btn-secondary {
             background: linear-gradient(90deg, #c084fc, #e879f9);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        
        // --- Icon Components ---
        const createIcon = (svg) => ({ size = 24, className = '', ...props }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
                fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                className={className} {...props} dangerouslySetInnerHTML={{ __html: svg }}
            />
        );

        const Briefcase = createIcon('<rect width="20" height="14" x="2" y="7" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />');
        const CreditCard = createIcon('<rect width="20" height="14" x="2" y="5" rx="2" /><line x1="2" x2="22" y1="10" y2="10" />');
        const Clock = createIcon('<circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />');
        const ShieldCheck = createIcon('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>');
        const Zap = createIcon('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>');
        const MessageCircleOff = createIcon('<path d="m21 2-2 2m-2 2-2 2"/><path d="M3 22V8.5A5.5 5.5 0 0 1 8.5 3H12"/><path d="M21 12.5a5.5 5.5 0 0 1-11 0V12"/>');
        const BadgePercent = createIcon('<path d="M3.85 8.62a4 4 0 0 1 4.78-4.78L20 10Z"/><path d="M8.62 3.85 10 20l1.24-1.24"/><path d="m14 8 1.24-1.24"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="16.5" cy="16.5" r=".5" fill="currentColor"/>');
        const Rocket = createIcon('<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.3.05-3.11.65-.8.05-2.27-.05-3.11-1.5-1.26-5-2-5-2s.5 3.74 2 5Z"/><path d="m12.5 18.5-1-1 2-2c.57-.57.57-1.5 0-2.07l-2-2-1-1c-.57-.57-1.5-.57-2.07 0l-2 2-1-1c-.57-.57-1.5-.57-2.07 0l-2 2c-.57.57-.57 1.5 0 2.07l1 1-1 1c-.57.57-.57 1.5 0 2.07l2 2c.57.57 1.5.57 2.07 0l1-1 1 1c.57.57 1.5.57 2.07 0l2-2c.57-.57.57-1.5 0-2.07Z"/>');
        const HandCoins = createIcon('<path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 4.3-4.3c.9-.9 2.1-1.4 3.4-1.4h2a2 2 0 1 0 0-4h-1"/><path d="M12 5.5V11"/><circle cx="16" cy="4" r="2"/><circle cx="20" cy="8" r="1"/>');
        const Bot = createIcon('<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>');
        const Scale = createIcon('<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M2 16h3l3-8h3"/>');

        
        // --- Landing Page Component ---
        const LandingPage = () => {
            const [status, setStatus] = useState('idle'); // idle, submitting, success

            const handleSignup = async (e) => {
                e.preventDefault();
                setStatus('submitting');
                const form = e.target;
                const data = new FormData(form);

                // --- URL for Google Sheet submission ---
                const googleSheetURL = 'https://script.google.com/macros/s/AKfycbxoG9_IC0J2nr9VGwEV2S9zz0TdVyjnXwWJvvHU4xvsLWBgzvayokKhDwS4zMyIDgVS7Q/exec';

                const googleSheetData = new URLSearchParams();
                for (const pair of data.entries()) {
                    googleSheetData.append(pair[0], pair[1]);
                }

                try {
                    const response = await fetch(googleSheetURL, {
                        method: 'POST',
                        body: googleSheetData,
                    });

                    if (response.ok) {
                        setStatus('success');
                    } else {
                        throw new Error('Google Sheet submission failed');
                    }
                } catch (error) {
                    console.error('Form submission failed:', error);
                    alert('There was a problem with your submission. Please try again.');
                    setStatus('idle');
                }
            };

            return (
                <div className="bg-gray-900 text-white font-sans">
                    <header className="sticky top-0 bg-gray-900/80 backdrop-blur-sm p-6 z-20 flex justify-between items-center border-b border-gray-700/50">
                        <h1 className="text-2xl font-bold tracking-wider">DIGICLOAK</h1>
                        <nav className="hidden md:flex gap-6 items-center">
                            <a href="#problem" className="text-gray-300 hover:text-white transition-colors">The Problem</a>
                            <a href="#solution" className="text-gray-300 hover:text-white transition-colors">Our Solution</a>
                            <a href="#pricing" className="text-gray-300 hover:text-white transition-colors">Pricing</a>
                        </nav>
                        <a href="#signup" className="btn-primary text-white font-bold py-2 px-5 rounded-full transition-transform hover:scale-105">Get Early Access</a>
                    </header>

                    <main>
                        <section className="hero-bg min-h-screen flex items-center justify-center text-center p-6 -mt-20">
                            <div className="fade-in">
                                <h2 className="text-5xl md:text-7xl font-extrabold tracking-tight">
                                    Stop Searching. <br/> <span className="gradient-text">Start Doing.</span>
                                </h2>
                                <p className="mt-6 max-w-2xl mx-auto text-lg text-gray-300">
                                    The old way of finding help is broken. Digicloak is a one-time job marketplace that connects you with verified people for real tasks, right now. No spam, no delays, just results.
                                </p>
                                <a href="#signup" className="mt-8 inline-block btn-primary text-white font-bold py-3 px-8 rounded-full text-lg transition-transform hover:scale-105">
                                    Join the Waitlist
                                </a>
                            </div>
                        </section>

                        <section id="problem" className="py-20 px-6 bg-gray-800/50">
                            <div className="max-w-5xl mx-auto text-center">
                                <h3 className="text-sm font-bold uppercase tracking-widest text-purple-400">THE PROBLEM</h3>
                                <h3 className="text-4xl font-extrabold text-white mt-4">Finding quick, reliable help is a job in itself.</h3>
                                <p className="mt-4 text-gray-400 text-lg">You need a tap fixed, a TV mounted, or a logo designed today. So you turn to classifieds and face the usual nightmare.</p>
                                <div className="grid md:grid-cols-3 gap-8 mt-12 text-left">
                                    <div className="bg-gray-900/70 p-6 rounded-xl transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-purple-500/10">
                                        <MessageCircleOff size={32} className="text-red-400" />
                                        <h4 className="font-bold text-xl mt-4 text-white">Endless Spam & Ghosting</h4>
                                        <p className="mt-2 text-gray-300">Your inbox fills with low-ball offers, and serious inquiries get lost in the noise. Most conversations lead nowhere.</p>
                                    </div>
                                    <div className="bg-gray-900/70 p-6 rounded-xl transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-purple-500/10">
                                        <Clock size={32} className="text-yellow-400" />
                                        <h4 className="font-bold text-xl mt-4 text-white">Unreliable Timelines</h4>
                                        <p className="mt-2 text-gray-300">"I'll be there tomorrow" becomes next week, leaving you frustrated and your task undone. Urgency is ignored.</p>
                                    </div>
                                    <div className="bg-gray-900/70 p-6 rounded-xl transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-purple-500/10">
                                        <CreditCard size={32} className="text-green-400" />
                                        <h4 className="font-bold text-xl mt-4 text-white">Awkward Payment Issues</h4>
                                        <p className="mt-2 text-gray-300">Haggling over prices is stressful. Cash payments are insecure. There's no guarantee of getting what you paid for.</p>
                                    </div>
                                </div>
                            </div>
                        </section>
                        
                         <section className="py-20 px-6 bg-gray-900">
                            <div className="max-w-6xl mx-auto">
                                <div className="text-center">
                                    <h3 className="text-sm font-bold uppercase tracking-widest text-purple-400">WHY WE'RE DIFFERENT</h3>
                                    <h3 className="text-4xl font-extrabold text-white mt-4">We Cut Through the Chaos.</h3>
                                </div>
                                <div className="grid md:grid-cols-3 gap-8 mt-12 text-center">
                                    <div className="bg-gray-800/50 p-6 rounded-xl">
                                        <Bot size={32} className="mx-auto text-red-400" />
                                        <h4 className="font-bold text-xl mt-4 text-white">Smarter than OIX</h4>
                                        <p className="mt-2 text-gray-300">Forget the endless scroll and praying for a reply. Our platform is a focused marketplace, not a digital garage sale. We connect you only with users who mean business.</p>
                                    </div>
                                    <div className="bg-gray-800/50 p-6 rounded-xl">
                                        <Scale size={32} className="mx-auto text-yellow-400" />
                                        <h4 className="font-bold text-xl mt-4 text-white">More Flexible than Urban Company</h4>
                                        <p className="mt-2 text-gray-300">Why pay fixed, premium prices for a simple task? Here, you set the budget and negotiate directly. You pay for the work, not the corporate overhead.</p>
                                    </div>
                                    <div className="bg-gray-800/50 p-6 rounded-xl">
                                        <HandCoins size={32} className="mx-auto text-green-400" />
                                        <h4 className="font-bold text-xl mt-4 text-white">Fairer than U6er</h4>
                                        <p className="mt-2 text-gray-300">On-demand shouldn't mean a massive commission cut. Our tiny 1% fee ensures workers get paid what they deserve, and posters get a fair price.</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section className="py-20 px-6 hero-bg" id="solution">
                             <div className="max-w-6xl mx-auto">
                                <div className="text-center mb-12">
                                    <h3 className="text-sm font-bold uppercase tracking-widest text-purple-400">THE ROADMAP</h3>
                                    <h3 className="text-4xl font-extrabold text-white mt-4">From Task to Done, Simplified.</h3>
                                    <p className="mt-4 text-gray-300 text-lg max-w-3xl mx-auto">We've designed a straightforward process for both sides of the marketplace, ensuring clarity and speed at every step.</p>
                                </div>
                                <div className="grid md:grid-cols-2 gap-12">
                                    <div>
                                        <h4 className="text-2xl font-bold text-white mb-6">If You Need Help (Poster)</h4>
                                        <div className="space-y-6 border-l-2 border-purple-500/50 ml-4">
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-purple-500 rounded-full flex items-center justify-center font-bold">1</div><h5 className="font-bold text-xl text-white">Post for Free</h5><p className="text-gray-300">Describe your task and set your budget in under 60 seconds. Your job is instantly visible to nearby workers.</p></div>
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-purple-500 rounded-full flex items-center justify-center font-bold">2</div><h5 className="font-bold text-xl text-white">Negotiate & Agree</h5><p className="text-gray-300">Receive offers and negotiate the price directly in the app. Our timed system ensures you only deal with serious workers.</p></div>
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-purple-500 rounded-full flex items-center justify-center font-bold">3</div><h5 className="font-bold text-xl text-white">Pay Securely</h5><p className="text-gray-300">Once you agree on a price, pay into our secure escrow. The money is held safely until the work is done.</p></div>
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-purple-500 rounded-full flex items-center justify-center font-bold">4</div><h5 className="font-bold text-xl text-white">Verify & Rate</h5><p className="text-gray-300">Use a simple OTP to confirm the job is complete. Your payment is released, and you can rate the worker to help the community.</p></div>
                                        </div>
                                    </div>
                                     <div>
                                        <h4 className="text-2xl font-bold text-white mb-6">If You're Ready to Work (Worker)</h4>
                                        <div className="space-y-6 border-l-2 border-indigo-500/50 ml-4">
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-indigo-500 rounded-full flex items-center justify-center font-bold">1</div><h5 className="font-bold text-xl text-white">Find & Offer</h5><p className="text-gray-300">Browse a live map of jobs near you. See a task you like? Accept the budget or make your own counter-offer.</p></div>
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-indigo-500 rounded-full flex items-center justify-center font-bold">2</div><h5 className="font-bold text-xl text-white">Agree on Price</h5><p className="text-gray-300">Once the poster accepts your offer, the job is yours. You'll get a notification the moment they secure the payment.</p></div>
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-indigo-500 rounded-full flex items-center justify-center font-bold">3</div><h5 className="font-bold text-xl text-white">Get the Job Done</h5><p className="text-gray-300">Navigate to the location, verify your arrival with an OTP, complete the work, and get a final OTP from the poster.</p></div>
                                            <div className="pl-8 relative"><div className="absolute -left-4 top-1 h-7 w-7 bg-indigo-500 rounded-full flex items-center justify-center font-bold">4</div><h5 className="font-bold text-xl text-white">Get Paid Instantly</h5><p className="text-gray-300">The moment the job is marked complete, the agreed amount is transferred to your Digicloak wallet. Withdraw anytime.</p></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section className="py-20 px-6 bg-gray-800/50">
                             <div className="max-w-4xl mx-auto">
                                <div className="text-center">
                                     <h3 className="text-sm font-bold uppercase tracking-widest text-purple-400">MARKET INSIGHTS</h3>
                                    <h3 className="text-4xl font-extrabold text-white mt-4">The Demand for On-Demand is Real.</h3>
                                    <p className="mt-4 text-gray-300 text-lg max-w-3xl mx-auto">We're not just building an app; we're solving a fundamental urban problem. The need for quick, accessible help is growing every day.</p>
                                </div>
                                <div className="mt-12 space-y-8">
                                    <div className="bg-gray-900/70 p-6 rounded-xl flex items-start gap-4 transition-transform hover:scale-105">
                                        <div className="flex-shrink-0 w-12 h-12 bg-purple-500/20 rounded-lg flex items-center justify-center">
                                            <Zap size={24} className="text-purple-400" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-xl text-white">The Rise of the "Do It For Me" Economy</h4>
                                            <p className="text-gray-300 mt-1">Time is the new currency. A NITI Aayog report estimates that nearly <span className="gradient-text font-bold">23.5 million workers</span> will be part of the gig economy by 2029-30. This isn't just about big projects; it's about a cultural shift where busy professionals prefer to delegate small, everyday tasks.</p>
                                        </div>
                                    </div>
                                    <div className="bg-gray-900/70 p-6 rounded-xl flex items-start gap-4 transition-transform hover:scale-105">
                                        <div className="flex-shrink-0 w-12 h-12 bg-green-500/20 rounded-lg flex items-center justify-center">
                                            <ShieldCheck size={24} className="text-green-400" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-xl text-white">The Trust Deficit is Costly</h4>
                                            <p className="text-gray-300 mt-1">Over <span className="gradient-text font-bold">60% of consumers</span> cite lack of trust and fear of scams as the primary reason they avoid unverified classifieds platforms. This hesitation creates a massive, untapped market for a platform built on security and accountability.</p>
                                        </div>
                                    </div>
                                     <div className="bg-gray-900/70 p-6 rounded-xl flex items-start gap-4 transition-transform hover:scale-105">
                                        <div className="flex-shrink-0 w-12 h-12 bg-yellow-500/20 rounded-lg flex items-center justify-center">
                                            <HandCoins size={24} className="text-yellow-400" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-xl text-white">Direct Connections Mean Real Savings</h4>
                                            <p className="text-gray-300 mt-1">Large service aggregators often add <span className="gradient-text font-bold">30-50% in commissions</span> and hidden fees. By facilitating direct negotiation and taking only a 1% fee, Digicloak empowers users to save significantly, putting more money in the pockets of both posters and workers.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                        
                        <section className="py-20 px-6 hero-bg" id="pricing">
                           <div className="max-w-6xl mx-auto text-center">
                                <h3 className="text-4xl font-extrabold text-white">Simple, Transparent Pricing</h3>
                                <p className="mt-4 text-gray-400 text-lg">No hidden fees. Just honest value.</p>
                                <div className="grid md:grid-cols-3 gap-8 mt-12 max-w-6xl mx-auto">
                                    <div className="bg-gray-900/70 p-8 rounded-2xl text-left"> <BadgePercent size={32} className="text-indigo-400" /> <h4 className="text-2xl font-bold mt-4 text-white">Pay-As-You-Go</h4> <p className="text-gray-300 mt-2">Perfect for one-off tasks. Posting is always free.</p> <p className="text-5xl font-extrabold mt-6 text-white">1<span className="text-3xl">%</span></p> <p className="text-gray-400">commission on successful jobs</p> </div>
                                    <div className="bg-gray-900/70 p-8 rounded-2xl text-left border-2 border-purple-500"> <Briefcase size={32} className="text-purple-400" /> <h4 className="text-2xl font-bold mt-4 text-white">Pro Subscription</h4> <p className="text-gray-300 mt-2">Ideal for frequent users and small businesses.</p> <p className="text-5xl font-extrabold mt-6 text-white">₹999<span className="text-xl">/mo</span></p> <p className="text-gray-400">Includes 5 job posts per month with 0% commission.</p> </div>
                                    <div className="bg-gray-900/70 p-8 rounded-2xl text-left"> <Rocket size={32} className="text-green-400" /> <h4 className="text-2xl font-bold mt-4 text-white">Post Add-ons</h4> <p className="text-gray-300 mt-2">Boost your post's visibility to get faster responses.</p> <p className="text-5xl font-extrabold mt-6 text-white">₹99<span className="text-xl">/each</span></p> <p className="text-gray-400">Mark as "Urgent" or "Featured" for 24 hours.</p> </div>
                                </div>
                            </div>
                        </section>
                        
                        <section className="py-20 px-6 hero-bg" id="signup">
                            <div className="max-w-2xl mx-auto">
                                {status !== 'success' ? (
                                    <div className="bg-gray-800/80 backdrop-blur-sm border border-purple-500/20 p-8 rounded-2xl shadow-2xl">
                                        <h3 className="text-3xl font-extrabold text-center text-white">Be the First to Know</h3>
                                        <p className="text-center text-gray-300 mt-2">Sign up for exclusive early access and launch notifications.</p>
                                        <form method="POST" onSubmit={handleSignup} className="mt-8 space-y-4">
                                            <input name="name" type="text" placeholder="Full Name" required className="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"/>
                                            <input name="email" type="email" placeholder="Email Address" required className="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"/>
                                            <input name="phone" type="tel" placeholder="Phone Number" required className="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"/>
                                            <button type="submit" className="w-full btn-primary text-white font-bold py-3 rounded-lg text-lg transition-transform hover:scale-105 disabled:opacity-50" disabled={status === 'submitting'}>
                                                {status === 'submitting' ? 'Submitting...' : (status === 'error' ? 'Try Again' : 'Notify Me')}
                                            </button>
                                            {status === 'error' && <p className="text-sm text-red-400 text-center">Sorry, there was an issue. Please check your details and try again.</p>}
                                        </form>
                                    </div>
                                ) : (
                                    <div className="text-center bg-gray-800/80 backdrop-blur-sm border border-purple-500/20 p-12 rounded-2xl shadow-2xl fade-in">
                                        <ShieldCheck size={48} className="text-green-400 mx-auto"/>
                                        <h3 className="text-3xl font-extrabold mt-4 text-white">You're on the list!</h3>
                                        <p className="text-gray-300 mt-2">Thank you for signing up. We'll notify you the moment Digicloak launches.</p>
                                    </div>
                                )}
                            </div>
                        </section>
                    </main>
                    
                    <footer className="text-center p-8 bg-gray-900 text-gray-500">
                        <p>&copy; {new Date().getFullYear()} Digicloak. All rights reserved.</p>
                    </footer>
                </div>
            );
        };
        
        // --- Root Application Component ---
        function App() {
            return <LandingPage />;
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
